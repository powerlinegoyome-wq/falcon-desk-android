name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Falcon Desk APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK with Gradle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/FalconDesk-v1.0.0.apk
          ls -la release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FalconDesk-APK
          path: release-output/FalconDesk-v1.0.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0
          name: "Falcon Desk Android v1.0.0"
          body: |
            ## 📱 Falcon Desk - Android APK

            Telegram botlarınızı Android telefonunuzdan canlı operatör masası olarak yönetin!

            ### ⬇️ Doğrudan İndirme
            - [📥 FalconDesk-v1.0.0.apk İndir](https://github.com/${{ github.repository }}/releases/download/v1.0.0/FalconDesk-v1.0.0.apk)

            ### Özellikler:
            - **Tamamen Bağımsız**: Bilgisayara ihtiyaç duymaz, doğrudan telefondan çalışır.
            - **Canlı Destek Operatör Paneli**: Botunuza yazan kullanıcılarla anlık sohbet.
            - **Mobil Uyumlu Arayüz**: WhatsApp/Telegram mobil deneyimi, kaydırılabilir sekmeler, geri tuşu.
            - **Çift Yönlü Medya**: Fotoğraf, belge, çıkartma, ses aktarımı.
            - **Yerel Güvenli Veritabanı**: IndexedDB ile mesaj ve sohbet geçmişi cihazınızda saklanır.
            - **Whitelist / Erişim Kontrolü**: Sadece izin verilen Telegram kullanıcılarıyla iletişim.
            - **Çoklu Dil Desteği**: Türkçe, İngilizce, Arapça, İspanyolca.
          files: release-output/FalconDesk-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
